<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #ff8c00 0%, #00e6ff 100%);
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 👈 El box elli tlam el 3anasir 3al janib kima el tsawira */
        .login-container {
            background-color: rgba(245, 245, 220, 0.85); /* loun mgarreb lel taswira */
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: #003366;
            margin-bottom: 25px;
            font-size: 32px;
            margin-top: 0;
        }

        .input-box {
            display: block;
            margin: 4px auto;
            padding: 8px 1px;
            width: 75%;              /* 👈 Na9assna fel toul mte3hom bch ywalliw aṣghir */
            max-width: 250px;        /* 👈 7ajm mathbout w aṣghir */
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        button {
            background-color: #ff0055;
            color: white;
            padding: 6px 10px;      /* 👈 Nafs el padding bch ywalliw 9ad ba3dhhom bil dhabt */
            width: 75%;              /* 👈 Nafs el toul 7atta el 7amra twalli 9ad'hom */
            max-width: 250px;        /* 👈 Nafs el max-width */
            border: none;
            border-radius: 8px;
            font-size: 19px;
            cursor: pointer;
            margin-top: 2px;
        }

        button:hover {
            background-color: #e0004c;
        }

        p { 
            color: #000; 
            margin-top: 20px; 
            font-size: 15px;
            margin-bottom: 0;
        }
        p a { color: #003366; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Sign In</h1>
        
        <input type="text" class="input-box" placeholder="Email or Phone Number">
        <input type="password" class="input-box" placeholder="Password">

        <button>Login</button>

        <p>Don't have an account? <a href="#">sign up</a></p>
    </div>

</body>
</html>
