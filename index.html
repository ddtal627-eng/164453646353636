<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #f8f400b4 0%, #ff0000 100%);
            background-attachment: fixed; /* 👈 Hetha elli yched el 5alfiya w yamna3ha ttsarba 3al louta */
            height: 100vh;                 /* 👈 Ykhalli el 5alfiya tched el ecran lkol mel fouq lel louta */
            margin: 0;                     /* 👈 Yna7i el espace el zeyed mtaah el navigateur */
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        
        h1 {
            color: #003366;
            margin-bottom: 20px;
        }

        .input-box {
            display: block;
            margin: 10px auto;
            padding: 8px 12px;
            width: 200px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }

        button {
            background-color: #ff0055;
            color: white;
            padding: 10px 20px;
            width: 226px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button:hover {
            background-color: #e0004c;
        }

        p { color: #000; margin-top: 15px; }
        p a { color: #003366; }
    </style>
</head>
<body>

    <h1>Sign In</h1>
    
    <input type="text" class="input-box" placeholder="Email or Phone Number">
    <input type="password" class="input-box" placeholder="Password">

    <button>Login</button>

    <p>Don't have an account? <a href="#">sign up</a></p>

</body>
</html>
