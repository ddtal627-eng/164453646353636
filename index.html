<!DOCTYPE html>
<html>
<head>
    <title>Get started!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #ff8c00 0%, #00e6ff 100%);
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;     /* 👈 Thatt el 3anasir 3al janib (el imin) */
            padding-right: 15%;        /* 👈 El mesāfa bin el 3anasir w 7arf el ʃāʃa */
        }
        
        h1 {
            color: #003366;
            margin-bottom: 25px;
            font-size: 32px;
            text-align: left;
        }

        .input-box {
            display: block;
            margin: 4px 0;
            padding: 8px 1px;
            width: 250px;              /* 👈 7ajm mathbout w aṣghir kima 7abbet */
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        button {
            background-color: #ff0055;
            color: white;
            padding: 6px 10px;         /* 👈 Nafs el padding */
            width: 250px;              /* 👈 Nafs el toul bch ywalliw 9ad ba3dhhom */
            border: none;
            border-radius: 8px;
            font-size: 19px;
            cursor: pointer;
            margin-top: 2px;
        }

        button:hover {
            background-color: #e0004c;
        }

        p { 
            color: #000; 
            margin-top: 20px; 
            font-size: 15px;
            text-align: left;
        }
        p a { color: #003366; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Sign In</h1>
    
    <input type="text" class="input-box" placeholder="Email or Phone Number">
    <input type="password" class="input-box" placeholder="Password">

    <button>Login</button>

    <p>Don't have an account? <a href="#">sign up</a></p>

</body>
</html>
