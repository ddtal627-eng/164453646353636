<!DOCTYPE html>
<html>
<head>
    <title>Get started!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #ff8c00 0%, #00e6ff 100%);
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;     /* 👈 Ychشد el kolhom 3al jnab */
            padding-right: 15%;        /* 👈 El mesāfa mel 7arf mtaah el telfoun */
        }
        
        /* 👈 El cader el jdid: fih ken el ḥafa w transparent yebda mwafeq el background */
        .login-container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 30px 25px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #003366;
            margin-bottom: 25px;
            font-size: 32px;
            width: 250px;              /* 👈 9ad el cases bil dhabt bch yji fi wasathom */
            text-align: center;        /* 👈 Yjip el ktaba "Sign In" fi wasat el sṭar mte3ha */
            margin-top: 0;
        }

        .input-box {
            display: block;
            margin: 8px 0;
            padding: 8px 1px;
            width: 250px;              /* 👈 7ajm mathbout w aṣghir */
            background-color: #ffffff;
            border: 0px solid #444;
            border-radius: 8px;
            color: #000000;
            font-size: 15px;
        }

        button {
            background-color: #ff0055;
            color: white;
            padding: 6px 10px;         /* 👈 Nafs el padding */
            width: 250px;              /* 👈 9ad el cases */
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            margin-top: 2px;
        }

        button:hover {
            background-color: #e0004c;
        }

        p { 
            color: #000; 
            margin-top: 30px; 
            font-size: 16px;
            width: 260px;              /* 👈 9ad el cases bch tji el jomla mwasla m3ahom */
            text-align: center;        /* 👈 Mwasse fel wasat */
            margin-bottom: 0;
        }
        p a { color: #003366; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Sign In</h1>
        
        <input type="text" class="input-box" placeholder="Email or Phone Number">
        <input type="password" class="input-box" placeholder="Password">

        <button>Login</button>

        <p>Don't have an account? <a href="#">sign up</a></p>
    </div>

</body>
</html>
