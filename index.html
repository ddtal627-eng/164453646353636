<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <!-- Balise hedhi hiya el mouhima bch el telfoun yefhem 7ajm el ecran -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #ff8c00 0%, #00e6ff 100%);
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            /* Tkhalli el form yji bil dhabt fel wost mtaah el telfoun */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        h1 {
            color: #003366;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .input-box {
            display: block;
            margin: 12px auto;
            padding: 14px 16px;   /* Kabbarna el padding bch tji el case wad7a */
            width: 280px;        /* Kabbarna el 3ardh bch yet9ra bil gda 3al telfoun */
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        button {
            background-color: #ff0055;
            color: white;
            padding: 14px 20px;
            width: 312px;        /* 3ardh mtawafeq m3ahom */
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #e0004c;
        }

        p { 
            color: #000; 
            margin-top: 20px; 
            font-size: 15px;
        }
        p a { color: #003366; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Sign In</h1>
    
    <input type="text" class="input-box" placeholder="Email or Phone Number">
    <input type="password" class="input-box" placeholder="Password">

    <button>Login</button>

    <p>Don't have an account? <a href="#">sign up</a></p>

</body>
</html>
